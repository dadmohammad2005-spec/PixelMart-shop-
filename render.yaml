services:
  - type: web
    name: pixelmart-store
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd shopsphere/backend && gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:8000,http://127.0.0.1:8000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:8000,http://127.0.0.1:8000,https://*.onrender.com"
