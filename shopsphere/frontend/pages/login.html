<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &mdash; PixelMart | MOBILE • LAPTOP • GADGETS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../assets/css/style.css" rel="stylesheet">
    <script>
        (function(){
            const saved = localStorage.getItem('pixelmart_theme') || localStorage.getItem('shall_shop_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', saved);
            document.documentElement.setAttribute('data-bs-theme', saved);
        })();
    </script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header Minimal -->
    <header class="navbar navbar-shall bg-white border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <img src="../assets/images/pixelmart-logo.png" alt="PixelMart Logo" style="height: 38px;">
                <div class="d-flex flex-column">
                    <span class="pixel-logo-text">Pixel<span class="mart-part">Mart</span></span>
                    <span class="pixel-tagline">MOBILE &bull; LAPTOP &bull; GADGETS</span>
                </div>
            </a>
            <div class="d-flex align-items-center gap-3">
                <button type="button" class="header-action-btn theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
                    <i class="bi bi-moon-stars-fill theme-toggle-icon text-primary"></i>
                </button>
                <a href="shop.html" class="text-muted small text-decoration-none">&larr; Back to Shop</a>
            </div>
        </div>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <h2 class="fw-bold mb-1">Welcome Back</h2>
                        <p class="text-muted small">Sign in to manage orders, wishlist, and profile.</p>
                    </div>

                    <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

                    <form id="loginForm" onsubmit="handleLoginForm(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email or Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                                <input type="text" class="form-control border-start-0" id="loginEmailOrUser" required placeholder="name@example.com" autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label small fw-semibold">Password</label>
                                <span class="small text-muted">Demo: <code>adminpassword123</code></span>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0" id="loginPassword" required placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="btnLoginSubmit">
                            Sign In
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top mt-2">
                        <span class="small text-muted">Don't have an account yet? </span>
                        <a href="register.html" class="small fw-bold text-primary">Create an Account</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-shall text-center py-3 mt-auto">
        <div class="container small text-secondary">
            &copy; 2026 Shall Shop International Inc. All rights reserved. "Discover More. Shop Better."
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>

    <script>
        async function handleLoginForm(e) {
            e.preventDefault();
            const alertBox = document.getElementById('loginAlert');
            alertBox.classList.add('d-none');

            const emailOrUser = document.getElementById('loginEmailOrUser').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('btnLoginSubmit');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';

            try {
                const res = await API.auth.login({
                    username: emailOrUser,
                    password: password
                });
                showToast(res.message || 'Login successful!', 'success');
                // Redirect to next param or account
                const params = new URLSearchParams(window.location.search);
                const next = params.get('next') || 'account.html';
                setTimeout(() => window.location.href = next, 800);
            } catch (err) {
                alertBox.textContent = err.message || 'Invalid email or password.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In';
            }
        }
    </script>
</body>
</html>
