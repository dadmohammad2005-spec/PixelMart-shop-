<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account &mdash; PixelMart | MOBILE • LAPTOP • GADGETS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../assets/css/style.css" rel="stylesheet">
    <script>
        (function(){
            const saved = localStorage.getItem('pixelmart_theme') || localStorage.getItem('shall_shop_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', saved);
            document.documentElement.setAttribute('data-bs-theme', saved);
        })();
    </script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="navbar navbar-shall bg-white border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <img src="../assets/images/pixelmart-logo.png" alt="PixelMart Logo" style="height: 38px;">
                <div class="d-flex flex-column">
                    <span class="pixel-logo-text">Pixel<span class="mart-part">Mart</span></span>
                    <span class="pixel-tagline">MOBILE &bull; LAPTOP &bull; GADGETS</span>
                </div>
            </a>
            <div class="d-flex align-items-center gap-3">
                <button type="button" class="header-action-btn theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
                    <i class="bi bi-moon-stars-fill theme-toggle-icon text-primary"></i>
                </button>
                <a href="login.html" class="text-muted small text-decoration-none">Already have an account? Sign In</a>
            </div>
        </div>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                            <i class="bi bi-person-plus-fill"></i>
                        </span>
                        <h2 class="fw-bold mb-1">Create Your Account</h2>
                        <p class="text-muted small">Join Shall Shop to enjoy saved carts, order tracking, and VIP member privileges.</p>
                    </div>

                    <div id="registerAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

                    <form id="registerForm" onsubmit="handleRegisterForm(event)">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label small fw-semibold">First Name *</label>
                                <input type="text" class="form-control" id="regFirstName" required placeholder="John">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label small fw-semibold">Last Name *</label>
                                <input type="text" class="form-control" id="regLastName" required placeholder="Doe">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="regEmail" required placeholder="name@example.com">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label class="form-label small fw-semibold">Username (Optional)</label>
                                <input type="text" class="form-control" id="regUsername" placeholder="johndoe">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label small fw-semibold">Phone Number (Optional)</label>
                                <input type="tel" class="form-control" id="regPhone" placeholder="+1 (555) 000-0000">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label small fw-semibold">Password *</label>
                                <input type="password" class="form-control" id="regPassword" required minlength="8" placeholder="At least 8 characters">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label small fw-semibold">Confirm Password *</label>
                                <input type="password" class="form-control" id="regPasswordConfirm" required minlength="8" placeholder="Repeat password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3" id="btnRegisterSubmit">
                            Create Account &rarr;
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top mt-2">
                        <span class="small text-muted">Already registered? </span>
                        <a href="login.html" class="small fw-bold text-primary">Sign in here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-shall text-center py-3 mt-auto">
        <div class="container small text-secondary">
            &copy; 2026 Shall Shop International Inc. All rights reserved. "Discover More. Shop Better."
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>

    <script>
        async function handleRegisterForm(e) {
            e.preventDefault();
            const alertBox = document.getElementById('registerAlert');
            alertBox.classList.add('d-none');

            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim() || email;
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            if (password !== passwordConfirm) {
                alertBox.textContent = 'Passwords do not match.';
                alertBox.classList.remove('d-none');
                return;
            }

            const submitBtn = document.getElementById('btnRegisterSubmit');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating account...';

            try {
                const res = await API.auth.register({
                    first_name: firstName,
                    last_name: lastName,
                    email: email,
                    username: username,
                    phone_number: phone,
                    password: password,
                    password_confirm: passwordConfirm
                });
                showToast(res.message || 'Account created successfully!', 'success');
                setTimeout(() => window.location.href = 'account.html', 800);
            } catch (err) {
                alertBox.textContent = err.message || 'Registration failed. Please check inputs.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Create Account &rarr;';
            }
        }
    </script>
</body>
</html>
